components:
  schemas:
    AssetCreate:
      properties:
        name:
          type: string
          title: Name
        type:
          $ref: '#/components/schemas/AssetType'
        tags:
          items:
            type: string
          type: array
          title: Tags
      type: object
      required:
      - name
      - type
      title: AssetCreate
    AssetType:
      type: string
      enum:
      - domain
      - ip
      title: AssetType
    AssetUpdateTags:
      properties:
        tags:
          items:
            type: string
          type: array
          title: Tags
      type: object
      title: AssetUpdateTags
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ScanRequest:
      properties:
        scan_type:
          $ref: '#/components/schemas/ScanType'
      type: object
      required:
      - scan_type
      title: ScanRequest
    ScanType:
      type: string
      enum:
      - dns
      - whois
      - subdomain
      - cert_trans
      - asn
      - all
      - ip
      - port
      - ssl
      - tech
      title: ScanType
    ScheduledScanCreate:
      properties:
        scan_type:
          $ref: '#/components/schemas/ScanType'
        interval_minutes:
          type: integer
          maximum: 1440.0
          minimum: 1.0
          title: Interval Minutes
      type: object
      required:
      - scan_type
      - interval_minutes
      title: ScheduledScanCreate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
